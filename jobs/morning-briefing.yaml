# Tier 2 / read: the spec §7 canonical example. Deterministic fetches, then
# exactly one model call to synthesize the briefing (D7).
id: morning-briefing
description: Assemble and speak the morning briefing
schedule: "0 7 * * 1-5"
tier: 2
mode: read

tools:
  - google-calendar.list_events
  - weather.get_forecast
  - github.list_notifications

steps:
  - tool: google-calendar.list_events
    args:
      range: today
    save_as: events
  - tool: weather.get_forecast
    args:
      latitude: 40.7128
      longitude: -74.0060
    save_as: forecast
  - tool: github.list_notifications
    args: {}
    save_as: repo_activity

synthesize: |
  Write a compact spoken-style morning briefing from this data.
  Calendar: {{events}}
  Weather: {{forecast}}
  GitHub: {{repo_activity}}
  Two short paragraphs at most. Lead with whatever most affects the day.

budget:
  max_tokens: 4000
  max_wall_clock_seconds: 60
  max_tool_calls: 10

on_failure:
  notify: display
  retry: 1
  escalate_after: 2

output:
  publish_to: atlas/jobs/morning-briefing/completed
  speak: true
