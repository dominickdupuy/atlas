# Repositories hosted on this machine, one [[repo]] each.
#
# Rendered into /etc/cron.d/atlas-repos and atlas-repo-*.service units by
# `scripts/repos.py apply` (run it after editing this file). Logs land in
# /var/log/atlas-repos/<name>/, summaries in /var/lib/atlas-repos/<name>.json,
# and `scripts/repos.py status` / `queue` read those back.
#
# Fields
#   name       short id; becomes the log directory and unit name
#   path       checkout on disk (cloned on first apply)
#   url        git remote; use an ssh alias from ~/.ssh/config when the host
#              needs its own deploy key (see `Host github-finance`)
#   branch     branch to track                                   (default main)
#   kind       job | service | both
#   schedule   cron expression, five fields, host local time      (job, both)
#   job        command run in `path`; output captured to the log (job, both)
#   service    long-running command systemd keeps alive          (service, both)
#   setup      one-time command run in `path` when setup_marker is absent
#   setup_marker  file whose presence means setup already ran
#   timeout_seconds  kill the job after this long                 (default 3600)
#   env        extra environment for the service                  (table)
#   enabled    false removes the cron line / stops the unit, keeps the checkout

[[repo]]
name = "finance"
description = "Morning review: classify what the rules could not, push to the cloud ledger"
path = "/opt/finance"
url = "git@github-finance:dominickdupuy/finances.git"
branch = "master"
kind = "job"
# 08:30 every day. The cloud container syncs at 08:00 and uploads the day's
# backup right after; this pulls that backup, classifies the queue with
# Claude, applies the decisions to the container, and commits new rules.
schedule = "30 8 * * *"
job = "FINTRACK_ENV_FILE=/home/domdd/finance.env .venv/bin/python -m fintrack.autoreview"
setup = "python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt"
setup_marker = ".venv/bin/python"
timeout_seconds = 1500

[[repo]]
name = "health-nightly"
description = "Nightly health analysis: FreeReps Postgres -> board.json + health.db + ntfy on ALERT"
path = "/opt/health"
url = "git@github-health:dominickdupuy/health.git"
branch = "main"
kind = "job"
# 10:00, after the phone's morning sync has landed the night. The board polls
# /api/status every ten seconds, so the new document is on the wall within one
# poll of the write.
schedule = "0 10 * * *"
job = "ATLAS_HEALTH_ENV_FILE=/home/domdd/atlas-health-analysis/.env /home/domdd/.local/bin/uv run atlas-health nightly"
setup = "/home/domdd/.local/bin/uv sync"
setup_marker = ".venv/bin/python"
timeout_seconds = 900

[[repo]]
name = "health-weekly"
description = "Sunday summary push (off unless WEEKLY_SUMMARY=true)"
path = "/opt/health"
url = "git@github-health:dominickdupuy/health.git"
branch = "main"
kind = "job"
schedule = "0 20 * * 0"
job = "ATLAS_HEALTH_ENV_FILE=/home/domdd/atlas-health-analysis/.env /home/domdd/.local/bin/uv run atlas-health weekly"
timeout_seconds = 300
