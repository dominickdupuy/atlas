# Mosquitto config (D6: events only; D12: never publicly reachable).
#
# Anonymous access is acceptable because the broker is only reachable from the
# compose network and the host's loopback. If the broker is ever published
# beyond loopback, add password_file auth first.

listener 1883
allow_anonymous true

# The runner persists everything that matters in SQLite (D16); broker-side
# persistence would only delay noticing a real failure.
persistence false

log_dest stdout
log_type error
log_type warning
