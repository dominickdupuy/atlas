<!doctype html>
<html lang="en" data-atlas-board data-asset-version="{{ asset_version }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>atlas ops board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/board.css?v={{ asset_version }}" />
  </head>
  <body>
    <!--
      The passive operations board (D11), implementing the "Atlas Board"
      design canvas. Output only: no button, form, input or link appears
      anywhere below, because the monitor has no input device. Approvals
      happen on the phone (D8); the queue is shown here for visibility only.

      The board is a fixed 1920x1080 canvas scaled to the viewport, exactly
      as the design's fit() does, so it renders identically on any panel.
    -->
    <div class="wrap" id="wrap">
      <div class="board" id="board">
        <div class="glow glow-a"></div>
        <div class="glow glow-b"></div>

        <header class="head">
          <div class="brand">
            <div class="mark">
              <svg viewBox="0 0 32 32" fill="none" stroke="#eaf2ff" stroke-width="1.6"
                   stroke-linecap="round" aria-hidden="true">
                <circle cx="16" cy="16" r="11.2" stroke-opacity="0.95"></circle>
                <ellipse cx="16" cy="16" rx="4.9" ry="11.2" stroke-opacity="0.6"></ellipse>
                <path d="M5.4 12.3h21.2M5.4 19.7h21.2" stroke-opacity="0.6"></path>
                <path d="M16 4.8v22.4" stroke-opacity="0.28"></path>
              </svg>
            </div>
            <div class="wordmark">atlas</div>
            <div class="build" id="build">—</div>
          </div>

          <div class="head-right">
            <!--
              A scale model of the desk dial (LifeSmart Colo Play) that stands
              beside this monitor: rounded-square body, a key at each corner,
              an oversized clickable dial with a round screen behind an LED
              ring. It is a mirror, not a control — nothing here is focusable,
              clickable or reachable by a pointer, so the board itself still
              carries no input (D11). It lights up because the hardware next to
              the screen was pressed. The dial's screen carries the display
              mode the header pill used to.

              The top-left key selects the screen already showing, so its LED
              is lit from the markup; the other three report a press and
              nothing more until something is behind them.
            -->
            <div class="deck" id="deck" data-mode="STARTING" aria-hidden="true">
              <div class="deck-key" data-key="1" data-pos="tl" data-active="true">
                <span class="deck-led"></span>
              </div>
              <div class="deck-key" data-key="2" data-pos="tr">
                <span class="deck-led"></span>
              </div>
              <div class="deck-key" data-key="3" data-pos="bl">
                <span class="deck-led"></span>
              </div>
              <div class="deck-key" data-key="4" data-pos="br">
                <span class="deck-led"></span>
              </div>
              <div class="deck-dial" id="deck-dial">
                <div class="deck-ring" id="deck-ring"></div>
                <div class="deck-knurl"></div>
                <div class="deck-screen">
                  <span class="deck-screen-text" id="mode-text" data-fit="tight">INIT</span>
                </div>
              </div>
            </div>
            <div class="clockwrap">
              <div class="clockline">
                <span class="clock" id="clock">--:--</span>
                <span class="meridiem" id="meridiem"></span>
              </div>
              <div class="datestr" id="datestr">&nbsp;</div>
            </div>
          </div>
        </header>

        <!-- Shown only when something needs a human. A healthy board is
             exactly the design; this band is the exception, not the frame. -->
        <section class="attention" id="attention" hidden>
          <div class="attention-head">
            <span class="attention-title" id="attention-title">ATTENTION</span>
            <span class="attention-more" id="attention-more"></span>
          </div>
          <ul class="attention-list" id="attention-list"></ul>
        </section>

        <!-- The staleness banner. The single most important element here:
             a board that has stopped updating must never look like one that
             has not. -->
        <section class="stale" id="stale" hidden>
          <span class="stale-title" id="stale-title">STALE DATA</span>
          <span class="stale-detail" id="stale-detail"></span>
        </section>

        <div class="main" id="main">
          <section class="panel panel-timeline">
            <div class="panel-head">
              <span class="panel-title" id="timeline-title">SCHEDULE</span>
              <span class="panel-source" id="timeline-source">—</span>
            </div>

            <div class="daybar" id="daybar"></div>

            <div class="grid">
              <div class="gutter" id="gutter"></div>
              <div class="cols" id="cols"></div>
            </div>

<!-- Job runs no longer appear here; the calendar shows the calendar. -->
            <div class="legend">
              <span class="key"><i data-cat="work"></i>busy</span>
              <span class="key"><i data-cat="free"></i>free / tentative</span>
              <span class="legend-note" id="legend-note"></span>
            </div>
          </section>

          <aside class="rail">
            <div class="panel panel-weather" id="weather-card">
              <div class="panel-head">
                <span class="panel-title">WEATHER</span>
                <span class="panel-source" id="weather-place">—</span>
              </div>
              <div class="weather-body" id="weather-body"></div>
            </div>

            <div class="panel panel-runs">
              <div class="panel-head">
                <span class="panel-title">RUNS</span>
                <span class="panel-source" id="runs-source">—</span>
              </div>
              <div class="runs" id="runs"></div>
              <p class="runs-note" id="runs-note" hidden></p>
            </div>

            <div class="panel panel-system">
              <div class="panel-head">
                <span class="panel-title">SYSTEM</span>
                <span class="panel-source" id="system-source">—</span>
              </div>
              <div class="sysgrid" id="sysgrid"></div>
            </div>
          </aside>
        </div>

        <!--
          The health screen (spec §7). A second `main` region, hidden until
          the dial's top-right key selects it. It is the only scrolling region
          on the board: everything needed to answer "how did I sleep, how is
          my heart, what should I change" is above the fold, and the dial
          reveals detail below it. Still output only — the dial is a device
          beside the screen, not a control on it.
        -->
        <div class="main main-health" id="main-health" hidden>
          <p class="health-unavailable" id="health-unavailable" hidden></p>

          <section class="health-tiles" id="health-tiles"></section>
          <section class="health-action" id="health-action"></section>

          <section class="panel health-block" id="health-sleep">
            <div class="panel-head">
              <span class="panel-title">SLEEP · 60 NIGHTS</span>
              <span class="panel-source" id="health-sleep-source">—</span>
            </div>
            <div class="health-split" id="health-sleep-body"></div>
          </section>

          <section class="panel health-block" id="health-exercise">
            <div class="panel-head">
              <span class="panel-title">EXERCISE</span>
              <span class="panel-source" id="health-exercise-source">—</span>
            </div>
            <div class="health-split" id="health-exercise-body"></div>
          </section>

          <section class="panel health-block" id="health-weight">
            <div class="panel-head">
              <span class="panel-title" id="health-weight-title">WEIGHT</span>
              <span class="panel-source" id="health-weight-source">—</span>
            </div>
            <div class="health-weight-body" id="health-weight-body"></div>
          </section>

          <section class="panel health-block" id="health-detail">
            <div class="panel-head">
              <span class="panel-title">SLEEP DETAIL</span>
              <span class="panel-source" id="health-detail-source">—</span>
            </div>
            <div class="health-split" id="health-detail-body"></div>
          </section>

          <p class="health-footer" id="health-footer"></p>
        </div>
      </div>
    </div>

    <script src="/static/board.js?v={{ asset_version }}"></script>
  </body>
</html>
